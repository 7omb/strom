# `pre-commit install` installs both hooks: at a commit, the fixers and `make lint`, `make type`; at a push,
# `make check` (which also runs the tests and the examples). The checks and ruff's fixers are defined in the Makefile
# only; `make fix` in turn runs the mdformat hook of this file.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-ast
  - id: check-merge-conflict
  - id: check-executables-have-shebangs
  - id: check-symlinks
  - id: check-toml
  - id: check-yaml
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-added-large-files
# Markdown: pure Python, so pre-commit's own venv runs it on NixOS too; options in .mdformat.toml.
- repo: https://github.com/hukkin/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm==1.0.0
    - mdformat-frontmatter==2.2.0
# Local hooks: the tools come from the dev shell (flake.nix) or the project venv and take their options from
# pyproject.toml. Downloaded ruff binaries don't run on NixOS; mypy and pyright need pytest and hypothesis.
- repo: local
  hooks:
  # fixers of the files in the commit
  - id: fix
    name: make fix (ruff)
    entry: sh -c 'make --no-print-directory --silent fix FILES="$*"' --
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: nixpkgs-fmt
    name: nixpkgs-fmt
    entry: nixpkgs-fmt
    language: system
    types: [nix]
  # the checks: the make targets, on the whole working tree
  - id: lint
    name: make lint
    entry: make lint
    language: system
    always_run: true  # the docs check also fails when a cited file of any type goes
    pass_filenames: false
  - id: type
    name: make type
    entry: make type
    language: system
    types_or: [python, pyi, toml]
    pass_filenames: false
  - id: check
    name: make check
    entry: make check
    language: system
    always_run: true
    pass_filenames: false
    stages: [pre-push]
