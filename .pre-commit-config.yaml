repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-ast
  - id: check-merge-conflict
  - id: check-executables-have-shebangs
  - id: check-symlinks
  - id: check-toml
  - id: check-yaml
  - id: detect-private-key
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.2
  hooks:
  - id: ruff
    args: [ --fix ]
  - id: ruff-format
- repo: local
  hooks:
  - id: nix-fmt
    name: nix-fmt
    entry: "nix fmt"
    types: [nix]
    language: system
