[project]
name = "strom"
version = "0.1.0"
description = "Typed, declarative stream processing on asyncio with shared worker pools"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Tom Bärwinkel", email = "dev@baerwinkel.org" }
]
requires-python = ">=3.14"
dependencies = []
keywords = ["pipeline", "stream processing", "asyncio", "concurrency", "dataflow", "arrows", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
# ruff, pyright and ty come from the dev shell (flake.nix), pinned by flake.lock: the ruff and ty wheels need
# nix-ld, the pyright wrapper downloads a node that needs it too.
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly>=5.1",  # tests in a random order (the seed is printed: `-p randomly --randomly-seed=N`)
    "pytest-repeat>=0.9.4",  # a suspected flake: `--count=50 -k TEST`, with `-n auto`
    "pytest-timeout>=2.4",  # a hung test fails with every thread's stack (`timeout` below)
    "pytest-xdist",
    "tox",
]
bench = ["pytest-benchmark"]  # benchmarks only; disabled when run with pytest-xdist (`-n`)

[tool.uv]
default-groups = ["dev", "bench"]  # so `uv sync` (direnv) keeps the bench group

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tools"]  # the development tools (strom_tools): not installed, tested in tests/tools
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
asyncio_mode = "auto"  # pytest-asyncio: every `async def` test and fixture runs on an event loop
asyncio_default_fixture_loop_scope = "function"
# Seconds per test (pytest-timeout): the slowest took 3.4 s (2026-11-11), the rare fan-out of generated law examples
# up to 232 s (docs/todo.md, Tests and benchmarks); a hang fails with every thread's stack.
timeout = 300
filterwarnings = [
    "error",  # e.g. a coroutine never awaited, a ResourceWarning
    "ignore:cpu_backend='thread' with the GIL enabled",
]

[tool.coverage.run]
branch = true
source = ["strom", "strom_tools"]

[tool.coverage.report]
show_missing = true
# Branch coverage was 97.0% on 2026-11-11, and 96.99% in the next run (timing-dependent branches): raise the floor
# with the coverage, never lower it to pass.
fail_under = 96.5

[tool.mypy]
strict = true
strict_bytes = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
files = ["src", "tests", "benchmarks", "bin", "tools"]  # examples: each in its own environment (`make type`)

[[tool.mypy.overrides]]
module = ["strom", "strom.*", "strom_tools", "strom_tools.*"]
disallow_any_expr = true
# Not in the tests: there it flags the `raise …` before the `yield` that makes an async generator, and attributes
# that an awaited call changes after an `assert` narrowed them.
warn_unreachable = true

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests", "benchmarks", "bin", "tools"]  # examples: see [tool.mypy]
extraPaths = ["tools"]  # the wrappers in bin and the tests import strom_tools from there
venvPath = "."
venv = ".venv"
enableTypeIgnoreComments = false  # `# type: ignore` is mypy's; pyright's own is `# pyright: ignore[rule]`
reportUnnecessaryTypeIgnoreComment = "error"  # an ignore expires with the bug it was for (mypy: strict)
# Off even in strict mode; for every file
reportImplicitOverride = "error"  # as mypy's `explicit-override`
reportUninitializedInstanceVariable = "error"
reportPropertyTypeMismatch = "error"
reportCallInDefaultInitializer = "error"
deprecateTypingAliases = true

# The library in strict mode, spelled out: `strict = ["src"]` can't be overridden per rule. Left out (see
# docs/decisions/pyright-strict.md): reportUnknownArgumentType, reportUnknownMemberType,
# reportUnknownVariableType, reportUnnecessaryComparison.
[[tool.pyright.executionEnvironments]]
root = "src"
reportPrivateUsage = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
strictListInference = true
strictSetInference = true
strictDictionaryInference = true
reportMissingTypeStubs = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportTypeCommentUsage = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportInconsistentConstructor = "error"
reportInvalidStringEscapeSequence = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportInvalidTypeVarUse = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryContains = "error"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportInvalidStubStatement = "error"
reportIncompleteStub = "error"
reportUnsupportedDunderAll = "error"
reportUnusedExpression = "error"
reportMatchNotExhaustive = "error"

# The tools with the library's rules: the same list (an environment can't refer to another one's; at the top
# level the rules would hold for the tests too, see docs/decisions/tool-package.md).
[[tool.pyright.executionEnvironments]]
root = "tools"
reportPrivateUsage = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
strictListInference = true
strictSetInference = true
strictDictionaryInference = true
reportMissingTypeStubs = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportTypeCommentUsage = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportInconsistentConstructor = "error"
reportInvalidStringEscapeSequence = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportInvalidTypeVarUse = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryContains = "error"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportInvalidStubStatement = "error"
reportIncompleteStub = "error"
reportUnsupportedDunderAll = "error"
reportUnusedExpression = "error"
reportMatchNotExhaustive = "error"

# The rest (tests, benchmarks, the wrappers in bin): the library's list without reportPrivateUsage (tests may test
# internals, ARCHITECTURE.md) and reportUnknownLambdaType (the lambdas passed to stages, .claude/rules/typing-api.md).
# The first environment whose root holds a file applies.
[[tool.pyright.executionEnvironments]]
root = "."
reportUnusedClass = "error"
reportUnusedFunction = "error"
strictListInference = true
strictSetInference = true
strictDictionaryInference = true
reportMissingTypeStubs = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportTypeCommentUsage = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportInconsistentConstructor = "error"
reportInvalidStringEscapeSequence = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportInvalidTypeVarUse = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryContains = "error"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportInvalidStubStatement = "error"
reportIncompleteStub = "error"
reportUnsupportedDunderAll = "error"
reportUnusedExpression = "error"
reportMatchNotExhaustive = "error"

[tool.ty.environment]
python-version = "3.14"
python = ".venv"  # as pyright's `venv`: not the active one (a tox env runs `make type` with its own active)
extra-paths = ["tools"]  # as pyright's `extraPaths`

[tool.ty.src]
include = ["src", "tests", "benchmarks", "bin", "tools"]  # examples: see [tool.mypy]

[tool.ty.rules]
unused-ignore-comment = "error"  # a warning would pass `ty check`: an ignore expires with the bug it was for

[tool.ruff]
target-version = "py314"
line-length = 120
src = [".", "src", "tools"]  # the roots of first-party imports: the default and the tools

[tool.ruff.lint]
select = [
    "A", "ANN", "ASYNC", "B", "C4", "DTZ", "E", "ERA", "F", "FA", "FLY", "FURB", "G", "I", "ISC", "LOG", "PERF", "PGH",
    "PIE", "PLE", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLOT", "T10", "TID", "UP", "W", "YTT",
]
ignore = [
    "UP046",  # explicit TypeVars on purpose: pyright infers PEP 695 type parameters of the sum tags invariant
    "RUF022",  # `__all__` in the order of the user guide, not sorted
    "RUF023",  # `__slots__` in the order of the fields
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["open"]  # the opener of a worker handle (`worker_handle(open)`), as `contextlib` names it

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest checks
    "S603",  # subprocesses run sys.executable with fixed arguments
    "ASYNC110",  # polls of a state that has no event to wait for (another thread's or process's), within a timeout
]
"benchmarks/**" = [
    "S101",  # assert is how pytest checks
    "PERF401",  # loops shaped like the consumers and the steps they measure
]
"tests/tool_helpers.py" = ["S607"]  # git from PATH, in repositories the tests make
"tools/**" = [
    "S603",  # runs sys.executable, git, make and the checkers with arguments of its own
    "S607",  # git, make, uv, pyright and ty from PATH (the dev shell)
]
